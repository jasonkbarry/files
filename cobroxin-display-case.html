<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobroxin Display Case</title>
<style>
  :root {
    --bg: #0f1520; --panel: #161e2c; --ink: #e8edf6; --muted: #9aa7bc; --line: #2a3446;
    --accent: #4d8dff; --accent-ink: #08101e;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f6fb; --panel: #ffffff; --ink: #17202e; --muted: #5a6578; --line: #dbe2ee;
            --accent: #005fec; --accent-ink: #ffffff; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font);
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 20px; padding: 24px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  header { text-align: center; }
  h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); font-weight: 700; }
  p.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .frame { width: 100%; max-width: 960px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 14px; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  video { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; max-height: 80vh; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  a.btn { text-decoration: none; font-weight: 600; font-size: 14px; border-radius: 10px; padding: 11px 20px;
          background: var(--accent); color: var(--accent-ink); }
  a.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  a.btn:hover { filter: brightness(1.08); }
  footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Cobroxin Display Case</h1>
    <p class="sub">Press play to watch. Use the button below to download the file.</p>
  </header>
  <div class="frame">
    <video controls playsinline preload="metadata">
      <source src="Cobroxin - 1080p Radio Promo.mp4" type="video/mp4">
      Your browser can't play this video. Use the download button below.
    </video>
  </div>
  <div class="actions">
    <a class="btn" href="Cobroxin - 1080p Radio Promo.mp4" download>Download MP4</a>
  </div>
  <footer>1080p · MP4</footer>
</body>
</html>
